<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usserschwyz Athletics</title>
<meta name="description" content="Leichtathletik-Trainingsgruppe aus Ausserschwyz. Sprint, Hürden und Mittelstrecke, U18 bis Aktive, Training in Pfäffikon und im Chrummen.">
<meta property="og:title" content="Usserschwyz Athletics">
<meta property="og:description" content="Leichtathletik-Trainingsgruppe aus Ausserschwyz.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://usserschwyz-athletics.com/">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>try{if(!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("anim")}catch(e){}</script>
<style>
  body[data-page="start"]{background:#F4F1EC}
  body[data-page="start"] header.site{background:transparent;border-bottom-color:transparent;position:absolute;left:0;right:0}
  .cover{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;background:#F4F1EC}
  .cover .wrap{position:relative;z-index:2;padding-top:clamp(104px,15vh,170px)}
  .cover h1{font-family:'Inter Tight',sans-serif;font-weight:800;color:#14213D;font-size:clamp(52px,min(10vw,15vh),152px);line-height:.88;letter-spacing:-.045em;margin:0}
  .cover h1 span{display:block}
  .cover h1 .two{color:#B3262B}
  .track{position:absolute;left:0;right:0;bottom:0;width:100%;height:48%;z-index:1}
  .track .lane{fill:none;stroke:#fff;stroke-width:3}
  .track .num{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:26px;fill:#fff}

  /* Einstieg: Titel steigt auf, Bahnlinien werden gezogen */
  html.anim .cover h1 span{opacity:0;transform:translateY(40px);animation:titleIn 1s cubic-bezier(.2,.7,.2,1) forwards}
  html.anim .cover h1 .two{animation-delay:.12s}
  html.anim .track .tartan{opacity:0;animation:fade .9s ease .1s forwards}
  html.anim .track .lane{stroke-dasharray:2600;stroke-dashoffset:2600;animation:draw 1.6s cubic-bezier(.4,0,.2,1) forwards}
  html.anim .track .num{opacity:0;animation:fade .6s ease 1.3s forwards}
  .scroll-hint{position:absolute;z-index:3;left:max(24px,calc((100vw - 1200px) / 2 + 24px));bottom:24px;display:inline-flex;align-items:center;gap:8px;background:#F4F1EC;color:#14213D;font-weight:600;font-size:15px;text-decoration:none;padding:10px 14px;border-radius:4px}
  .scroll-hint:hover{background:#fff}
  .scroll-hint svg{animation:nudge 1.8s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:none}50%{transform:translateY(3px)}}
  .agenda{background:#F4F1EC;padding-block:88px 104px}
  .agenda .wrap{max-width:980px}
  .agenda h2{font-family:'Inter Tight',sans-serif;font-weight:800;font-size:clamp(34px,5vw,56px);letter-spacing:-.03em;color:#14213D;margin-bottom:28px}
  .agenda-table td{padding-block:18px;font-size:16px}
  .agenda-table td.date{font-family:'Inter Tight',sans-serif;font-weight:700;color:#B3262B;white-space:nowrap;font-variant-numeric:tabular-nums}
  .agenda-table td.title{font-weight:600;color:#14213D}
  .agenda-table td.muted{color:#64748B}
  .agenda-table tr.soon td.date::after{content:"bald";display:inline-block;margin-left:10px;font-family:Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:#B3262B;padding:2px 7px;border-radius:3px;vertical-align:2px}
  .agenda-table th{border-bottom-color:#14213D}
  @media (max-width:640px){.agenda-table thead{display:none}table.list.agenda-table tr{display:grid;grid-template-columns:1fr;gap:4px;padding-block:16px;border-bottom:1px solid #D9D4CB}table.list.agenda-table td{border:0;padding:0}table.list.agenda-table td[data-label]::before{content:attr(data-label) ": ";color:#64748B}}
  @media (max-width:640px){.cover .wrap{padding-top:22vh}.track{height:44%}}
  @keyframes titleIn{to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
</style>
</head>
<body data-page="start">
<header id="site-header"></header>

<main class="cover">
  <svg class="track" viewBox="0 340 1600 560" preserveAspectRatio="xMaxYMin slice" aria-hidden="true">
    <!-- Tartanbahn: 8 Bahnen, Gerade links, Kurve rechts unten -->
    <path class="tartan" fill="#B3262B" d="M-40 360 H1150 A740 740 0 0 1 1890 1100 H1530 A380 380 0 0 0 1150 720 H-40 Z"/>
    <g id="lanes"></g>
    <line class="lane" x1="210" y1="360" x2="210" y2="720"/>
    <g id="nums"></g>
  </svg>
  <div class="wrap">
    <h1><span class="one">Usserschwyz</span><span class="two">Athletics</span></h1>
  </div>
  <a class="scroll-hint" href="#termine">Termine <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></a>
</main>

<section class="agenda" id="termine">
  <div class="wrap">
    <h2>Termine</h2>
    <div class="table-scroll">
      <table class="list agenda-table">
        <thead><tr><th>Datum</th><th>Anlass</th><th>Zeit</th><th>Ort</th></tr></thead>
        <tbody id="events-table"></tbody>
      </table>
    </div>
    <p class="note" id="events-empty" hidden>Zurzeit sind keine Termine eingetragen.</p>
  </div>
</section>

<script>
  // Bahnlinien und Bahnnummern zeichnen
  (function () {
    var lanes = document.getElementById('lanes'), nums = document.getElementById('nums'), ns = 'http://www.w3.org/2000/svg';
    for (var i = 0; i <= 8; i++) {
      var r = 380 + i * 45, y = 1100 - r;
      var p = document.createElementNS(ns, 'path');
      p.setAttribute('class', 'lane');
      p.setAttribute('d', 'M-40 ' + y + ' H1150 A' + r + ' ' + r + ' 0 0 1 ' + (1150 + r) + ' 1100');
      p.style.animationDelay = (0.2 + (8 - i) * 0.06) + 's';
      lanes.appendChild(p);
      if (i < 8) {
        var t = document.createElementNS(ns, 'text');
        t.setAttribute('class', 'num'); t.setAttribute('x', 150); t.setAttribute('y', y - 22 + 9);
        t.setAttribute('text-anchor', 'middle'); t.textContent = i + 1;
        nums.appendChild(t);
      }
    }
  })();
</script>
<footer id="site-footer"></footer>
<script src="data.js"></script>
<script src="assets/main.js"></script>
</body>
</html>
